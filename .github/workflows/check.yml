name: check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Contrôles du catalogue
        run: scripts/check.sh
      - name: Format du plugin et de la marketplace
        run: npx -y @anthropic-ai/claude-code@2.1.309 plugin validate .
